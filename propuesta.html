<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmprendeNet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-[#fbf6ec]">
<header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">

        <div class="flex items-center gap-4 lg:gap-10">
            <img src="images/logo.jpg" 
                alt="EmprendeNet Logo" 
                class="h-14 w-14 lg:h-20 lg:w-20 rounded-3xl object-cover">

            <span class="text-2xl lg:text-3xl font-bold text-black">
                EmprendeNet
            </span>
        </div>

        <!-- Botón hamburguesa -->
        <button 
            class="hamburger lg:hidden" 
            id="menu-toggle" 
            aria-label="Abrir menú" 
            aria-expanded="false"
        >
            <img src="images/menu.png" 
                alt="Abrir menú" 
                id="menu-icon" 
                class="w-10 h-10">
        </button>

        <!-- Menú escritorio -->
        <ul class="hidden lg:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
            <li><a href="index.html" class="hover:text-orange-500 text-xl">Inicio</a></li>
            <li><a href="propuesta.html" class="hover:text-orange-500 text-xl">Propuesta</a></li>
            <li><a href="acerca.html" class="hover:text-orange-500 text-xl">Acerca</a></li>
            <li><a href="contacto.html" class="hover:text-orange-500 text-xl">Contacto</a></li>
        </ul>

    </nav>

    <!-- Menú móvil -->
    <ul 
        id="main-nav" 
        class="hidden flex-col gap-6 text-lg text-center font-bold bg-white w-full py-6 px-8 shadow-md lg:hidden"
    >
        <li><a href="index.html" class="hover:text-orange-500">Inicio</a></li>
        <li><a href="#Propuesta" class="hover:text-orange-500">Propuesta</a></li>
        <li><a href="acerca.html" class="hover:text-orange-500">Acerca</a></li>
        <li><a href="contacto.html" class="hover:text-orange-500">Contacto</a></li>
    </ul>
</header>

<script src="js/script.js"></script>


 <!-- Propuesta-->
    <section class="max-w-7xl mx-auto px-6 pb-16">
       
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-16 mt-10">
           
            <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4">Buscar/Filtrar</h2>

                <!-- Buscador -->
                <div class="relative mb-6">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        
                    </span>
                    <input type="text" class="w-full border border-gray-300 rounded-lg pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="Buscar emprendimiento">
                </div>

                <!-- Chips de categorías -->
                <div class="flex flex-wrap gap-3 mb-6 text-sm font-semibold justify-center">
                    <button class="px-4 py-1 rounded-full bg-yellow-300">Todos</button>
                    <button class="px-4 py-1 rounded-full bg-red-500 text-white  hover:bg-orange-500">Alimentos</button>
                    <button class="px-4 py-1 rounded-full bg-blue-500 text-white">Telas</button>
                    <button class="px-4 py-1 rounded-full bg-orange-500 text-white">Artesanías</button>
                    <button class="px-4 py-1 rounded-full bg-gray-400 text-white">Ropa</button>
                    <button class="px-4 py-1 rounded-full bg-purple-500 text-white">Flores</button>
                    <button class="px-4 py-1 rounded-full bg-pink-500 text-white">Belleza</button>
                    <button class="px-4 py-1 rounded-full bg-green-500 text-white">Ecológico</button>
                    <button class="px-4 py-1 rounded-full bg-cyan-500 text-white">Batidos</button>
                    <button class="px-4 py-1 rounded-full bg-gray-500 text-white">Servicios</button>
                </div>

                <!-- Filtro por precio (maquetado) -->
                <p class="text-center text-sm font-semibold mb-2">Filtra por precio</p>
                <div class="mx-4 mb-2 h-1 bg-yellow-300 rounded-full relative">
                    <span class="absolute -left-1 -top-1 w-3 h-3 bg-yellow-500 rounded-full"></span>
                    <span class="absolute -right-1 -top-1 w-3 h-3 bg-yellow-500 rounded-full"></span>
                </div>
                <div class="flex justify-between items-center text-xs mt-1">
                    <span>Precio: ₡1000 — ₡30000</span>
                    <button class="px-4 py-1 bg-yellow-400 rounded-full font-semibold text-sm">Filtrar</button>
                </div>
            </div>

            <!-- Registrar emprendimiento -->
            <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold mb-4">Registrar emprendimiento</h2>

                <div class="space-y-3 text-sm">
                    <div>
                        <label class="font-semibold block mb-1">Nombre</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300">
                    </div>

                    <div>
                        <label class="font-semibold block mb-1">Categoría</label>
                        <div class="relative">
                            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 appearance-none focus:outline-none focus:ring-2 focus:ring-orange-300">
                                <option>Todos</option>
                                <option>Alimentos</option>
                                <option>Artesanías</option>
                                <option>Ropa</option>
                                <option>Servicios</option>
                            </select>
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-yellow-500">▼</span>
                        </div>
                    </div>

                    <div>
                        <label class="font-semibold block mb-1">Ubicación</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="https://">
                    </div>

                    <div>
                        <label class="font-semibold block mb-1">Productos</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="h-16 bg-gradient-to-b from-sky-200 to-sky-400 rounded-lg"></div>
                            <div class="h-16 bg-gradient-to-b from-sky-200 to-sky-400 rounded-lg"></div>
                            <div class="h-16 bg-gradient-to-b from-sky-200 to-sky-400 rounded-lg"></div>
                        </div>
                    </div>

                    <div>
                        <label class="font-semibold block mb-1">Descripción</label>
                        <textarea rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300"></textarea>
                    </div>

                    <div class="flex justify-center gap-4 pt-2">
                        <button class="px-4 py-2 bg-gray-200 rounded-full font-semibold">Cancelar</button>
                        <button class="px-4 py-2 bg-yellow-400 rounded-full font-semibold">Registrar</button>
                    </div>
                </div>
            </div>
        </div>

    
        
    </section>

   <!-- Footer-->
    <footer class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full mt-8 shadow-md">
      <div class="max-w-7xl mx-auto px-6">
        <div class="py-6 text-center font-semibold">© 2025 EmprendeNet | Todos los derechos reservados</div>
      </div>
    </footer>
</body>
</html>

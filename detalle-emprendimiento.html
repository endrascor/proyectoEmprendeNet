<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Emprendimiento - EmprendeNet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
    
    <style>
        html {
            text-size-adjust: 100%;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .slide-in {
            animation: slideIn 0.5s ease-out;
        }

        /* Carrusel */
        .carousel-container {
            position: relative;
            overflow: hidden;
        }
        
        .carousel-track {
            display: flex ;
            transition: transform 0.5s ease-in-out;
        }
        
        .carousel-slide {
            min-width: 100%;
            flex-shrink: 12;
        }
    </style>
</head>
<body class="bg-[#fbf6ec]">

<!-- Header -->
<header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
        <div class="flex items-center gap-4 lg:gap-10">
            <img src="images/logo.jpg" 
                alt="EmprendeNet Logo" 
                class="h-14 w-14 lg:h-20 lg:w-20 rounded-3xl object-cover">
            <span class="text-2xl lg:text-3xl font-bold text-black">
                EmprendeNet
            </span>
        </div>

        <!-- Botón hamburguesa -->
        <button 
            class="hamburger lg:hidden" 
            id="menu-toggle" 
            aria-label="Abrir menú" 
            aria-expanded="false"
        >
            <img src="images/menu.png" 
                alt="Abrir menú" 
                id="menu-icon" 
                class="w-10 h-10">
        </button>

        <!-- Menú escritorio -->
        <ul class="hidden lg:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
            <li><a href="index.html" class="hover:text-orange-500 text-xl">Inicio</a></li>
            <li><a href="propuesta.html" class="hover:text-orange-500 text-xl">Emprendimientos</a></li>
            <li><a href="acerca.html" class="hover:text-orange-500 text-xl">Acerca</a></li>
            <li><a href="contacto.html" class="hover:text-orange-500 text-xl">Contacto</a></li>
        </ul>
    </nav>

    <!-- Menú móvil -->
    <ul 
        id="main-nav" 
        class="hidden flex-col gap-6 text-lg text-center font-bold bg-white w-full py-6 px-8 shadow-md lg:hidden"
    >
        <li><a href="index.html" class="hover:text-orange-500">Inicio</a></li>
        <li><a href="propuesta.html" class="hover:text-orange-500">Emprendimientos</a></li>
        <li><a href="acerca.html" class="hover:text-orange-500">Acerca</a></li>
        <li><a href="contacto.html" class="hover:text-orange-500">Contacto</a></li>
    </ul>
</header>

    <!-- Contenido Principal -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12">
        <!-- Botón Volver -->
        <a href="propuesta.html" class="inline-flex items-center text-base sm:text-lg text-orange-600 hover:text-orange-700 font-semibold mb-6 transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Volver a Emprendimientos
        </a>

        <!-- Contenedor del Detalle -->
        <div id="detalleContenedor" class="fade-in">
            <!-- El contenido se llenará dinámicamente -->
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-t-4 border-orange-500"></div>
            <p class="mt-4 text-gray-600 text-base sm:text-lg">Cargando detalles...</p>
        </div>

        <!-- Error -->
        <div id="error" class="hidden text-center py-16">
            <div class="text-6xl mb-4">⚠️</div>
            <p class="text-xl text-gray-600 mb-4">No se pudo cargar el emprendimiento</p>
            <a href="propuesta.html" class="inline-block px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition">
                Volver a Emprendimientos
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full mt-8 shadow-md">
        <div class="max-w-7xl mx-auto px-6">
            <div class="py-6 text-center font-semibold">© 2025 EmprendeNet | Todos los derechos reservados</div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        var emprendimiento = null;
        var currentSlide = 0;
        var LOCAL_EMPRENDIMIENTOS_KEY = 'emprendimientosLocales'; //key para localStorage

        function obtenerEmprendimientosLocales() {
            try {
                var almacenados = JSON.parse(localStorage.getItem(LOCAL_EMPRENDIMIENTOS_KEY));
                return Array.isArray(almacenados) ? almacenados : [];
            } catch (error) {
                console.error('Error al leer emprendimientos locales:', error);
                return [];
            }
        }

        // Buscar emprendimiento por ID
        function encontrarEmprendimientoPorId(lista, idBuscado) {
            for (var i = 0; i < lista.length; i++) {
                if (String(lista[i].id) === String(idBuscado)) {
                    return lista[i];
                }
            }
            return null;
        }

        function obtenerGaleriaImagenes(emp) {
            if (!emp) {
                return ['https://placehold.co/800x600?text=Emprendimiento'];
            }
            var imagenes = [];
            if (emp.imagenes && emp.imagenes.length) {
                imagenes = emp.imagenes.slice();
            }
            if (imagenes.length === 0 && emp.imagen) {
                imagenes.push(emp.imagen);
            }
            if (imagenes.length === 0) {
                imagenes.push('https://placehold.co/800x600?text=Emprendimiento');
            }
            return imagenes;
        }

        // Obtener ID del emprendimiento de la URL
        function obtenerIdEmprendimiento() {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Funciones del carrusel
        function nextSlide() {
            var imagenes = obtenerGaleriaImagenes(emprendimiento);
            currentSlide = (currentSlide + 1) % imagenes.length;
            updateCarousel();
        }

        function prevSlide() {
            var imagenes = obtenerGaleriaImagenes(emprendimiento);
            currentSlide = (currentSlide - 1 + imagenes.length) % imagenes.length;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        function updateCarousel() {
            var track = document.getElementById('carouselTrack');
            if (track) {
                track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
            }
            
            // Actualizar indicadores
            var indicators = document.querySelectorAll('.carousel-indicator');
            for (var i = 0; i < indicators.length; i++) {
                if (i === currentSlide) {
                    indicators[i].classList.add('bg-orange-500');
                    indicators[i].classList.remove('bg-gray-300');
                } else {
                    indicators[i].classList.remove('bg-orange-500');
                    indicators[i].classList.add('bg-gray-300');
                }
            }
        }

        // Cargar datos del emprendimiento
        function cargarEmprendimiento() {
            var id = obtenerIdEmprendimiento();
            
            if (!id) {
                mostrarError();
                return;
            }

            fetch('json/emprendimientos.json')
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    var combinados = data.concat(obtenerEmprendimientosLocales());
                    emprendimiento = encontrarEmprendimientoPorId(combinados, id);

                    if (emprendimiento) {
                        mostrarDetalle();
                    } else {
                        mostrarError();
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    var locales = obtenerEmprendimientosLocales();
                    emprendimiento = encontrarEmprendimientoPorId(locales, id);
                    if (emprendimiento) {
                        mostrarDetalle();
                    } else {
                        mostrarError();
                    }
                });
        }

        function mostrarDetalle() {
            document.getElementById('loading').style.display = 'none';
            currentSlide = 0;
            
            var coloresCategoria = {
                'Alimentos': 'bg-red-500',
                'Telas': 'bg-blue-500',
                'Artesanías': 'bg-orange-500',
                'Ropa': 'bg-gray-300',
                'Flores': 'bg-purple-400',
                'Belleza': 'bg-pink-500',
                'Ecológico': 'bg-green-400',
                'Batidos': 'bg-cyan-400',
                'Servicios': 'bg-gray-400'
            };

            var categoria = emprendimiento.categoria || 'Sin categoría';
            var colorCategoria = coloresCategoria[categoria] || 'bg-purple-600';
            var precioNumero = Number(emprendimiento.precio);
            var precioFormateado = isNaN(precioNumero)
                ? 'Precio a consultar'
                : '₡' + precioNumero.toLocaleString('es-CR');
            var descripcionBasica = emprendimiento.descripcion || 'Sin descripción disponible.';

            var html = '<div class="bg-white rounded-3xl shadow-2xl overflow-hidden">';
            
            // Header con categoría
            html += '<div class="' + colorCategoria + ' text-white px-6 py-4">';
            html += '<span class="inline-block px-4 py-1 bg-white bg-opacity-20 rounded-full text-sm font-semibold">' + categoria + '</span>';
            html += '</div>';

            // Contenido principal en grid
            html += '<div class="grid grid-cols-1 gap-8 lg:grid-cols-2 lg:gap-12 p-6 sm:p-8">';
            
            // Columna izquierda - Carrusel de imágenes
            html += '<div class="slide-in">';
            html += '<div class="space-y-6 lg:sticky lg:top-24">';
            
            // Carrusel
            var imagenes = obtenerGaleriaImagenes(emprendimiento);
            html += '<div class="carousel-container relative rounded-2xl overflow-hidden shadow-lg">';
            html += '<div id="carouselTrack" class="carousel-track">';
            for (var i = 0; i < imagenes.length; i++) {
                html += '<div class="carousel-slide">';
                html += '<img src="' + imagenes[i] + '" alt="' + emprendimiento.nombre + ' - Imagen ' + (i + 1) + '" class="w-full h-full object-contain">';
                html += '</div>';
            }
            html += '</div>';
            
            // Botones de navegación del carrusel
            if (imagenes.length > 1) {
                html += '<button onclick="prevSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white bg-opacity-75 hover:bg-opacity-100 text-gray-800 rounded-full p-2 shadow-lg transition">';
                html += '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>';
                html += '</button>';
                html += '<button onclick="nextSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white bg-opacity-75 hover:bg-opacity-100 text-gray-800 rounded-full p-2 shadow-lg transition">';
                html += '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                html += '</button>';
                
                // Indicadores
                html += '<div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">';
                for (var i = 0; i < imagenes.length; i++) {
                    html += '<button onclick="goToSlide(' + i + ')" class="carousel-indicator w-3 h-3 rounded-full ' + (i === 0 ? 'bg-orange-500' : 'bg-gray-300') + ' transition"></button>';
                }
                html += '</div>';
            }
            html += '</div>';
            
            // Precio
            html += '<div class="mt-4 sm:mt-6 p-5 sm:p-6 bg-gradient-to-r from-orange-100 to-yellow-100 rounded-2xl">';
            html += '<div class="text-center">';
            html += '<p class="text-gray-600 text-xs sm:text-sm font-semibold mb-2">Precio desde</p>';
            html += '<p class="text-3xl sm:text-4xl font-bold text-orange-600">' + precioFormateado + '</p>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
            html += '</div>';

            // Columna derecha - Información
            html += '<div class="space-y-6 lg:pl-4">';
            
            // Nombre
            html += '<div>';
            html += '<h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">' + emprendimiento.nombre + '</h1>';
            html += '<p class="text-base sm:text-lg text-gray-600 leading-relaxed">' + descripcionBasica + '</p>';
            html += '</div>';

            // Descripción detallada
            if (emprendimiento.descripcionDetallada) {
                html += '<div class="border-t pt-6">';
                html += '<h2 class="text-2xl font-bold text-gray-800 mb-3 flex items-center gap-2">';
                html += '<span>📋</span> Acerca de nosotros';
                html += '</h2>';
                html += '<p class="text-gray-600 text-base sm:text-lg leading-relaxed">' + emprendimiento.descripcionDetallada + '</p>';
                html += '</div>';
            }

            // Características
            if (emprendimiento.caracteristicas && emprendimiento.caracteristicas.length > 0) {
                html += '<div class="border-t pt-6">';
                html += '<h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">';
                html += '<span>✨</span> Características';
                html += '</h2>';
                html += '<ul class="space-y-3">';
                for (var i = 0; i < emprendimiento.caracteristicas.length; i++) {
                    html += '<li class="flex items-start gap-3">';
                    html += '<svg class="w-6 h-6 text-green-500 flex-shrink-0 mt-1" fill="currentColor" viewBox="0 0 20 20">';
                    html += '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>';
                    html += '</svg>';
                    html += '<span class="text-gray-700 text-base sm:text-lg">' + emprendimiento.caracteristicas[i] + '</span>';
                    html += '</li>';
                }
                html += '</ul>';
                html += '</div>';
            }

            // Productos
            if (emprendimiento.productos && emprendimiento.productos.length > 0) {
                html += '<div class="border-t pt-6">';
                html += '<h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">';
                html += '<span>🛍️</span> Nuestros Productos';
                html += '</h2>';
                html += '<div class="grid grid-cols-2 gap-3">';
                for (var i = 0; i < emprendimiento.productos.length; i++) {
                    html += '<div class="bg-gradient-to-br from-orange-50 to-yellow-50 px-4 py-3 rounded-xl text-center">';
                    html += '<p class="text-gray-800 font-semibold text-sm sm:text-base">' + emprendimiento.productos[i] + '</p>';
                    html += '</div>';
                }
                html += '</div>';
                html += '</div>';
            }

            // Información de contacto
            html += '<div class="border-t pt-6">';
            html += '<h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">';
            html += '<span>📞</span> Información de Contacto';
            html += '</h2>';
            html += '<div class="space-y-3 bg-gray-50 p-6 rounded-2xl">';
            
            if (emprendimiento.ubicacion) {
                html += '<div class="flex items-start gap-3">';
                html += '<span class="text-2xl">📍</span>';
                html += '<div><p class="text-xs sm:text-sm text-gray-500">Ubicación</p><p class="text-gray-800 font-semibold text-sm sm:text-base">' + emprendimiento.ubicacion + '</p></div>';
                html += '</div>';
            }
            
            if (emprendimiento.contacto) {
                html += '<div class="flex items-start gap-3">';
                html += '<span class="text-2xl">📱</span>';
                html += '<div><p class="text-xs sm:text-sm text-gray-500">Teléfono</p><p class="text-gray-800 font-semibold text-sm sm:text-base">' + emprendimiento.contacto + '</p></div>';
                html += '</div>';
            }
            
            if (emprendimiento.email) {
                html += '<div class="flex items-start gap-3">';
                html += '<span class="text-2xl">✉️</span>';
                html += '<div><p class="text-xs sm:text-sm text-gray-500">Email</p><p class="text-gray-800 font-semibold text-sm sm:text-base">' + emprendimiento.email + '</p></div>';
                html += '</div>';
            }
            
            if (emprendimiento.horario) {
                html += '<div class="flex items-start gap-3">';
                html += '<span class="text-2xl">🕐</span>';
                html += '<div><p class="text-xs sm:text-sm text-gray-500">Horario</p><p class="text-gray-800 font-semibold text-sm sm:text-base">' + emprendimiento.horario + '</p></div>';
                html += '</div>';
            }
            
            html += '</div>';
            html += '</div>';

            html += '</div>'; // Fin columna derecha
            html += '</div>'; // Fin grid
            html += '</div>'; // Fin card principal

            document.getElementById('detalleContenedor').innerHTML = html;
        }

        function mostrarError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').classList.remove('hidden');
        }

        // Inicializar
        cargarEmprendimiento();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | EmprendeNet</title>

    <!-- Tailwind CSS -->
     
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-[#fbf6ec]">
<header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">

        <div class="flex items-center gap-4 lg:gap-10">
            <img src="images/logo.jpg" 
                alt="EmprendeNet Logo" 
                class="h-14 w-14 lg:h-20 lg:w-20 rounded-3xl object-cover">

            <span class="text-2xl lg:text-3xl font-bold text-black">
                EmprendeNet
            </span>
        </div>

        <!-- Botón hamburguesa -->
        <button 
            class="hamburger lg:hidden" 
            id="menu-toggle" 
            aria-label="Abrir menú" 
            aria-expanded="false"
        >
            <img src="images/menu.png" 
                alt="Abrir menú" 
                id="menu-icon" 
                class="w-10 h-10">
        </button>

        <!-- Menú escritorio -->
        <ul class="hidden lg:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
            <li><a href="index.html" class="hover:text-orange-500 text-xl">Inicio</a></li>
            <li><a href="propuesta.html" class="hover:text-orange-500 text-xl">Propuesta</a></li>
            <li><a href="acerca.html" class="hover:text-orange-500 text-xl">Acerca</a></li>
            <li><a href="contacto.html" class="hover:text-orange-500 text-xl">Contacto</a></li>
        </ul>

    </nav>

    <!-- Menú móvil -->
    <ul 
        id="main-nav" 
        class="hidden flex-col gap-6 text-lg text-center font-bold bg-white w-full py-6 px-8 shadow-md lg:hidden"
    >
        <li><a href="index.html" class="hover:text-orange-500">Inicio</a></li>
        <li><a href="propuesta.html" class="hover:text-orange-500">Propuesta</a></li>
        <li><a href="acerca.html" class="hover:text-orange-500">Acerca</a></li>
        <li><a href="contacto.html" class="hover:text-orange-500">Contacto</a></li>
    </ul>
</header>

<script src="js/script.js"></script>

    <!-- Título -->
    <section class="max-w-6xl mx-auto text-left py-12 px-6">
        <h1 class="text-4xl md:text-4xl font-bold">Comparte tus sugerencias</h1>
        <p class="text-gray-500 mt-4 text-2xl">Complete el formulario y confirme el envio</p>
    </section>

<!-- Contenedor principal -->
<main id="contactoContainer" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 grid grid-cols-1 lg:grid-cols-2 gap-10"></main>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-md p-6 relative">
    <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
    <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Confirmación</h2>
    <p><strong>Nombre:</strong> <span id="modalNombre"></span></p>
    <p><strong>Correo:</strong> <span id="modalCorreo"></span></p>
    <p><strong>Asunto:</strong> <span id="modalAsunto"></span></p>
    <p><strong>Mensaje:</strong> <span id="modalMensaje"></span></p>
    <div class="mt-4 flex justify-end">
      <button id="modalAceptar" class="px-4 py-2 bg-blue-700 text-white rounded hover:bg-orange-500 transition">Aceptar</button>
    </div>
  </div>
</div>

<!-- Script reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<script>
async function cargarContacto() {
    const response = await fetch("json/contacto.json");
    const data = await response.json();
    const container = document.getElementById('contactoContainer');

    // --- Formulario ---
    const formSection = document.createElement('section');
    formSection.className = "bg-white rounded-lg shadow p-6";
    formSection.innerHTML = `
        <h2 class="text-2xl font-bold mb-4 text-gray-800">${data.titulo}</h2>
        <form id="contactForm" class="space-y-4" method="POST" action="${data.form_action || '#'}" novalidate>
            <div>
                <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-1">${data.nombre_label}</label>
                <input type="text" id="nombre" name="nombre" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="${data.nombre_placeholder}">
                <p id="errorNombre" class="mt-1 text-sm text-red-500 hidden">${data.error_nombre}</p>
            </div>

            <div>
                <label for="correo" class="block text-sm font-semibold text-gray-700 mb-1">${data.correo_label}</label>
                <input type="email" id="correo" name="correo" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="${data.correo_placeholder}">
                <p id="errorCorreo" class="mt-1 text-sm text-red-500 hidden">${data.error_correo}</p>
            </div>

            <div>
                <label for="asunto" class="block text-sm font-semibold text-gray-700 mb-1">${data.asunto_label}</label>
                <input type="text" id="asunto" name="asunto" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="${data.asunto_placeholder}">
                <p id="errorAsunto" class="mt-1 text-sm text-red-500 hidden">${data.error_asunto}</p>
            </div>

            <div>
                <label for="mensaje" class="block text-sm font-semibold text-gray-700 mb-1">${data.mensaje_label}</label>
                <textarea id="mensaje" name="mensaje" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300" placeholder="${data.mensaje_placeholder}"></textarea>
                <p id="errorMensaje" class="mt-1 text-sm text-red-500 hidden">${data.error_mensaje}</p>
            </div>

            <div class="mt-4 w-full flex justify-center">
                <div class="g-recaptcha" id="recaptchaContainer" data-sitekey="${data.recaptcha_sitekey}"></div>
            </div>
            <p id="errorCaptcha" class="mt-2 text-sm text-red-500 text-center hidden">${data.error_captcha || 'Por favor, verifica que no eres un robot.'}</p>

            <button type="submit" class="mt-4 w-full px-4 py-2 bg-blue-700 shadow-md text-white font-bold hover:bg-orange-500 transition">${data.boton}</button>
        </form>
    `;
    container.appendChild(formSection);

    // --- Render reCAPTCHA ---
    if (window.grecaptcha && data.recaptcha_sitekey) {
        grecaptcha.render('recaptchaContainer', { sitekey: data.recaptcha_sitekey });
    }

    // --- Mapa ---
    const mapaSection = document.createElement('section');
    mapaSection.className = "bg-white rounded-lg shadow p-6 flex flex-col";
    mapaSection.innerHTML = `
        <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">${data.mapa_titulo}</h2>
        <p class="text-gray-600 mb-4 text-center">${data.mapa_desc}</p>
        <div class="flex-1 rounded-lg overflow-hidden border border-gray-200 shadow-inner min-h-[320px]">
            <iframe src="${data.mapa_embed || ''}" width="100%" height="100%" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    `;
    container.appendChild(mapaSection);

    // --- Validaciones y modal ---
    (function() {
        const form = document.getElementById('contactForm');
        const nombre = document.getElementById('nombre');
        const correo = document.getElementById('correo');
        const asunto = document.getElementById('asunto');
        const mensaje = document.getElementById('mensaje');

        const errorNombre = document.getElementById('errorNombre');
        const errorCorreo = document.getElementById('errorCorreo');
        const errorAsunto = document.getElementById('errorAsunto');
        const errorMensaje = document.getElementById('errorMensaje');
        const errorCaptcha = document.getElementById('errorCaptcha');

        const modal = document.getElementById('modal');
        const modalNombre = document.getElementById('modalNombre');
        const modalCorreo = document.getElementById('modalCorreo');
        const modalAsunto = document.getElementById('modalAsunto');
        const modalMensaje = document.getElementById('modalMensaje');
        const closeModal = document.getElementById('closeModal');
        const modalAceptar = document.getElementById('modalAceptar');

        function mostrarError(elemento, errorElemento, condicionValida) {
            errorElemento.classList.toggle('hidden', condicionValida);
            elemento.classList.toggle('border-red-500', !condicionValida);
            return condicionValida;
        }

        function validarNombre() { return mostrarError(nombre, errorNombre, nombre.value.trim().length >= 3); }
        function validarCorreo() { return mostrarError(correo, errorCorreo, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo.value.trim())); }
        function validarAsunto() { return mostrarError(asunto, errorAsunto, asunto.value.trim().length >= 5); }
        function validarMensaje() { return mostrarError(mensaje, errorMensaje, mensaje.value.trim().length >= 10); }
        function validarCaptcha() {
            const esValido = grecaptcha.getResponse().length > 0;
            errorCaptcha.classList.toggle('hidden', esValido);
            return esValido;
        }

        nombre.addEventListener('blur', validarNombre);
        correo.addEventListener('blur', validarCorreo);
        asunto.addEventListener('blur', validarAsunto);
        mensaje.addEventListener('blur', validarMensaje);

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const camposValidos = validarNombre() & validarCorreo() & validarAsunto() & validarMensaje();
            const captchaValido = validarCaptcha();
            if (!(camposValidos && captchaValido)) return;

            modalNombre.textContent = nombre.value.trim();
            modalCorreo.textContent = correo.value.trim();
            modalAsunto.textContent = asunto.value.trim();
            modalMensaje.textContent = mensaje.value.trim() || 'Sin mensaje adicional.';
            modal.classList.remove('opacity-0', 'pointer-events-none');
        });

        function cerrarModal() { modal.classList.add('opacity-0', 'pointer-events-none'); }
        closeModal.addEventListener('click', cerrarModal);
        modalAceptar.addEventListener('click', function() {
            cerrarModal();
            form.submit();
        });
        modal.addEventListener('click', function(event) { if(event.target === modal) cerrarModal(); });

        // Evitar que reCAPTCHA se rompa al volver con back/forward
        window.addEventListener('pageshow', function(event) {
            if(event.persisted && window.grecaptcha) grecaptcha.reset();
        });
    })();
}
cargarContacto();
</script>

<style>
.recaptcha-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    transform: scale(0.85);
    transform-origin: center;
}
@media (max-width: 340px) {
    .recaptcha-wrapper {
        transform: scale(0.75);
    }
}
</style>


    <!-- Footer -->
    <footer class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full mt-8 shadow-md">
        <div class="max-w-7xl mx-auto px-6">
            <div class="py-6 text-center font-semibold">© 2025 EmprendeNet | Todos los derechos reservados</div>
        </div>
    </footer>
</body>
</html>

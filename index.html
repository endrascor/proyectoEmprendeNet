<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmprendeNet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
</head>
<body>
    <header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
        <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
            <div class="flex items-center gap-10">
                <img src="images/logo.jpg" alt="EmprendeNet Logo" class="h-20 w-30 rounded-3xl object-cover">
                <span class="text-2xl font-bold text-black">EmprendeNet</span>
            </div>

            <ul class="hidden md:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
                <li><a href="#inicio" class="hover:text-orange-500 text-xl">Inicio</a></li>
                <li><a href="#Propuesta" class="hover:text-orange-500 text-xl">Propuesta</a></li>
                <li><a href="#Acerca" class="hover:text-orange-500 text-xl">Acerca</a></li>
                <li><a href="#Contacto" class="hover:text-orange-500 text-xl">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero del texto -->
        <section class="max-w-4xl mx-auto text-center py-12 px-6">
            <h1 class="text-4xl md:text-5xl font-extrabold">Bienvenido a EmprendeNet</h1>
            <p class="text-gray-500 mt-4">Descubre los nuevos emprendimientos locales</p>
        </section>

        <section class="relative max-w-5xl mx-auto px-6">
            <div class="relative rounded-lg overflow-hidden shadow-lg">
                <img src="falta la imagen" alt="ceramica" class="w-full h-56 md:h-72 object-cover">
                <div class="absolute inset-0 flex items-center justify-between px-4">
                    <button aria-label="Anterior" class="carousel-btn p-3 rounded-full shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <button aria-label="Siguiente" class="carousel-btn p-3 rounded-full shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div class="absolute inset-0 flex items-end">
                    <div class="w-full text-center mb-6">
                        <div class="inline-block bg-black/50 text-white px-6 py-3 rounded-md text-lg font-semibold">Productos artesanales hechos en barro</div>
                    </div>
                </div>
            </div>
        </section>
</body>
</html>

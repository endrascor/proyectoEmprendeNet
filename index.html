<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmprendeNet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
</head>
<body>
    <header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
        <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
            <div class="flex items-center gap-10">
                <img src="images/logo.jpg" alt="EmprendeNet Logo" class="h-20 w-30 rounded-3xl object-cover">
                <span class="text-2xl font-bold text-black">EmprendeNet</span>
            </div>

            <ul class="hidden md:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
                <li><a href="#inicio" class="hover:text-orange-500 text-xl">Inicio</a></li>
                <li><a href="#Propuesta" class="hover:text-orange-500 text-xl">Propuesta</a></li>
                <li><a href="#Acerca" class="hover:text-orange-500 text-xl">Acerca</a></li>
                <li><a href="#Contacto" class="hover:text-orange-500 text-xl">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero del texto -->
        <section class="max-w-4xl mx-auto text-center py-12 px-6">
            <h1 class="text-4xl md:text-5xl font-extrabold">Bienvenido a EmprendeNet</h1>
            <p class="text-gray-500 mt-20">Descubre los nuevos emprendimientos locales</p>
        </section>

        <!-- Slider -->
<section class="mb-5">
  <div class="relative w-full max-w-5xl mx-auto">

    <!-- Slides -->
    <div class="overflow-hidden rounded-xl">
    <div id="carouselTW" class="flex transition-transform duration-700 w-full">
    <img src="images/logo.jpg" class="w-full h-80 object-cover flex-shrink-0" />
    <img src="images/Captura.JPG" class="w-full h-80 object-cover flex-shrink-0" />
    <img src="images/receta-de-pie-de-manzana.jpg" class="w-full h-80 object-cover flex-shrink-0" />
</div>
    </div>

    <!-- Flecha izquierda -->
    <button onclick="moveTW(-1)"
      class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black p-3 rounded-full text-white">
      &#10094;
    </button>

    <!-- Flecha derecha -->
    <button onclick="moveTW(1)"
      class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black p-3 rounded-full text-white">
      &#10095;
    </button>

    <!-- Indicadores -->
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2">
      <button class="w-3 h-3 rounded-full bg-white/70" onclick="goToTW(0)"></button>
      <button class="w-3 h-3 rounded-full bg-white/40" onclick="goToTW(1)"></button>
      <button class="w-3 h-3 rounded-full bg-white/40" onclick="goToTW(2)"></button>
    </div>

  </div>
  <script>
  let currentTW = 0;
  const twSlides = document.querySelectorAll('#carouselTW img');
  const totalTW = twSlides.length;

  function updateIndicators() {
    const indicators = document.querySelectorAll("section button.w-3");
    indicators.forEach((btn, index) => {
      btn.classList.toggle("bg-white/70", index === currentTW);
      btn.classList.toggle("bg-white/40", index !== currentTW);
    });
  }

  function moveTW(dir) {
    currentTW = (currentTW + dir + totalTW) % totalTW;
    document.getElementById('carouselTW').style.transform =
      `translateX(-${currentTW * 100}%)`;
    updateIndicators();
  }

  function goToTW(index) {
    currentTW = index;
    document.getElementById('carouselTW').style.transform =
      `translateX(-${index * 100}%)`;
    updateIndicators();
  }
  // Inicializar estado y autoplay: avanzar cada 3 segundos
  document.getElementById('carouselTW').style.transform = `translateX(0%)`;
  updateIndicators();

  // Avanza automáticamente cada 3000 ms (3 segundos)
  const twAutoPlay = setInterval(() => moveTW(1), 3000);
</script>
</section>
</body>
</html>

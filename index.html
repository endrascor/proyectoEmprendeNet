<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmprendeNet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1DA1F2',
                    },
                },
            },
        };
    </script>
</head>
<body>
    <header class="bg-gradient-to-r from-orange-300 to-yellow-300 w-full shadow-md">
        <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
            <div class="flex items-center gap-10">
                <img src="images/logo.jpg" alt="EmprendeNet Logo" class="h-20 w-30 rounded-3xl object-cover">
                <span class="text-2xl font-bold text-black">EmprendeNet</span>
            </div>

            <ul class="hidden md:flex gap-10 text-sm font-bold bg-white rounded-full px-8 py-3 shadow-sm">
                <li><a href="#inicio" class="hover:text-orange-500 text-xl">Inicio</a></li>
                <li><a href="#Propuesta" class="hover:text-orange-500 text-xl">Propuesta</a></li>
                <li><a href="#Acerca" class="hover:text-orange-500 text-xl">Acerca</a></li>
                <li><a href="#Contacto" class="hover:text-orange-500 text-xl">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero del texto -->
        <section class="max-w-4xl mx-auto text-center py-12 px-6">
            <h1 class="text-4xl md:text-5xl font-extrabold">Bienvenido a EmprendeNet</h1>
            <p class="text-gray-500 mt-20">Descubre los nuevos emprendimientos locales</p>
        </section>

      <!-- Slider -->
<div data-hs-carousel='{
    "loadingClasses": "opacity-0",
    "dotsItemClasses": "hs-carousel-active:bg-blue-700 hs-carousel-active:border-blue-700 size-3 border border-gray-400 rounded-full cursor-pointer"
  }' class="relative">
  <div class="hs-carousel relative overflow-hidden w-full min-h-96 bg-white rounded-lg">
    <div class="hs-carousel-body absolute top-0 bottom-0 start-0 flex flex-nowrap transition-transform duration-700 opacity-0">
      <div class="hs-carousel-slide">
        <div class="flex justify-center h-full bg-gray-100 p-6">
          <span class="self-center text-4xl text-gray-800 transition duration-700">First slide</span>
        </div>
      </div>
      <div class="hs-carousel-slide">
        <div class="flex justify-center h-full bg-gray-200 p-6">
          <span class="self-center text-4xl text-gray-800 transition duration-700">Second slide</span>
        </div>
      </div>
      <div class="hs-carousel-slide">
        <div class="flex justify-center h-full bg-gray-300 p-6">
          <span class="self-center text-4xl text-gray-800 transition duration-700">Third slide</span>
        </div>
      </div>
    </div>
  </div>

  <button type="button" class="hs-carousel-prev hs-carousel-disabled:opacity-50 hs-carousel-disabled:cursor-default absolute top-1/2 start-2 inline-flex justify-center items-center size-10 bg-white border border-gray-100 text-gray-800 rounded-full shadow-2xs hover:bg-gray-100 -translate-y-1/2 focus:outline-hidden">
    <span class="text-2xl" aria-hidden="true">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </span>
    <span class="sr-only">Previous</span>
  </button>
  <button type="button" class="hs-carousel-next hs-carousel-disabled:opacity-50 hs-carousel-disabled:cursor-default absolute top-1/2 end-2 inline-flex justify-center items-center size-10 bg-white border border-gray-100 text-gray-800 rounded-full shadow-2xs hover:bg-gray-100 -translate-y-1/2 focus:outline-hidden">
    <span class="sr-only">Next</span>
    <span class="text-2xl" aria-hidden="true">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </span>
  </button>

  <div class="hs-carousel-pagination flex justify-center absolute bottom-3 start-0 end-0 flex gap-x-2"></div>
</div>
<!-- End Slider -->
</body>
</html>
